name: Release

# Publishes a release line as lib-v<library_version>.
#
# The Layout Sync workflow walks the release lines — finals on `main`, betas
# on `beta` — and pushes them; any push to either branch whose
# lib-v<library_version> tag is missing gets released here. main cuts full
# releases; beta cuts prereleases (its library_version carries the -beta
# suffix). Manual library_version bumps work the same way.
#
# Pipeline:
#   1. Re-fetch the pinned upstream inputs (the release versions recorded in
#      khipro.meta) and regenerate the spec tables — they must come out
#      byte-identical, or the tables and their recorded versions have drifted
#      and the release aborts.
#   2. Build + run every conformance suite natively.
#   3. Cross-build windows/android/wasm in containers.
#   4. Tag lib-v<library_version>, push, create the GitHub release, attach
#      prebuilt artifacts. A macOS job builds the tagged commit and attaches
#      the universal macOS library.

on:
  push:
    branches: [main, beta]
  workflow_dispatch:

# contents: write → push commits/tags, create GitHub releases
permissions:
  contents: write

# Don't cancel an in-progress run — releases need to finish so partial state
# (pushed tag, created release) is either completed or recovered on rerun.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Checkout (full history, for tag comparison)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Make scripts executable
        run: chmod +x scripts/build.sh scripts/targets/*.sh scripts/resources/*.sh

      # -------------------------------------------------------------------
      # Gate — re-fetch the pinned upstream inputs, regenerate the spec
      # tables (byte-identical or abort), build, and run every conformance
      # suite natively. Everything after this step only runs if main is
      # proven releasable.
      # -------------------------------------------------------------------
      - name: Pin inputs, verify spec tables, build + test
        run: ./scripts/build.sh sync pinned

      - name: Decide if release is needed
        id: check
        run: |
          version="$(grep '^library_version=' khipro.meta | cut -d= -f2 | tr -d '[:space:]')"
          tag="lib-v${version}"

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::notice::tag ${tag} already exists — bump library_version in khipro.meta to release again."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::releasing ${tag}"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop if no release needed
        if: steps.check.outputs.skip == 'true'
        run: echo "Workflow complete — nothing released."

      # -------------------------------------------------------------------
      # Cross-platform builds. Tests already ran in the gate; these targets
      # produce the cross artifacts only.
      # -------------------------------------------------------------------
      - name: Cross-platform builds (Windows, Android, Wasm)
        if: steps.check.outputs.skip != 'true'
        run: |
          ./scripts/build.sh windows
          ./scripts/build.sh android
          ./scripts/build.sh wasm
          echo "--- artifacts ---"
          ls -la dist/windows/x86_64/bin/
          ls -la dist/android/jniLibs/arm64-v8a/
          ls -la dist/wasm/
          ls -la dist/android/*.aar

      # -------------------------------------------------------------------
      # Package dist/ into release archives.
      #   linux   → .tar.gz (preserves symlinks + perms + pkg-config)
      #   windows → .zip    (Windows consumers expect zip)
      #   wasm    → .zip    (matches npm/web ecosystem)
      #   android → .aar    (already an archive)
      # -------------------------------------------------------------------
      - name: Package dist artifacts
        if: steps.check.outputs.skip != 'true'
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          ver="${TAG#lib-v}"
          mkdir -p dist-artifacts

          tar -czf "dist-artifacts/khipro-${ver}-linux-x86_64.tar.gz" \
              -C dist linux/x86_64

          (cd dist && zip -r --quiet \
              "../dist-artifacts/khipro-${ver}-windows-x86_64.zip" \
              windows/x86_64)

          (cd dist && zip -r --quiet \
              "../dist-artifacts/khipro-${ver}-wasm.zip" \
              wasm)

          cp "dist/android/khipro-${ver}.aar" \
             "dist-artifacts/khipro-${ver}-android.aar"

          ls -la dist-artifacts/

      # -------------------------------------------------------------------
      # Release sequence — tag only after every build and test passed.
      # -------------------------------------------------------------------
      - name: Tag
        if: steps.check.outputs.skip != 'true'
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: git tag "$TAG"

      - name: Push tag
        if: steps.check.outputs.skip != 'true'
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: git push origin "$TAG"

      - name: Create GitHub release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          # Idempotent: if a previous run pushed the tag but failed later,
          # re-running is safe.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; nothing to create."
            exit 0
          fi

          prev_tag="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo '')"
          args=(--title "$TAG" --generate-notes)
          # Prerelease versions (e.g. 2.1-beta) stay off the "Latest" slot.
          ver="${TAG#lib-v}"
          case "$ver" in
            *-*) args+=(--prerelease) ;;
          esac
          if [[ -n "$prev_tag" ]]; then
            args+=(--notes-start-tag "$prev_tag")
          fi

          # Notes header: the exact layout versions this release ships, above
          # the auto-generated changelog (with both set, GitHub appends the
          # generated notes to the provided body).
          meta_get() { grep -E "^$1=" khipro.meta | head -1 | cut -d= -f2-; }
          notes_file="$(mktemp)"
          cat >"$notes_file" <<EOF
          ## Layouts shipped

          | Layout | Version |
          |---|---|
          | Classic | \`$(meta_get khipro_classic_version)\` |
          | Classic touchscreen | \`$(meta_get khipro_touchscreen_classic_version)\` |
          | Dark | \`$(meta_get khipro_dark_version)\` |
          | Dark touchscreen | \`$(meta_get khipro_touchscreen_dark_version)\` |

          > Breaking vs the v36.x line: four layouts across the ABI
          > (\`KHIPRO_VARIANT_CLASSIC / _CLASSIC_TOUCH / _DARK / _DARK_TOUCH\` —
          > old \`DEFAULT\`/\`TOUCHSCREEN\` names are gone; numeric values 0/1 kept).
          > Kotlin: \`KhiproVariant.CLASSIC…\`; TypeScript: \`'classic' | 'classic_touch' | 'dark' | 'dark_touch'\`.
          > \`library_version\` is now this library's own release line (${ver}).
          EOF
          args+=(--notes-file "$notes_file")

          gh release create "$TAG" "${args[@]}"

      - name: Upload artifacts to release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          # --clobber overwrites partial uploads from a previously-failed run.
          gh release upload "$TAG" dist-artifacts/* --clobber

  # ---------------------------------------------------------------------
  # macOS can't be cross-compiled from the Linux runner. Build the released
  # tag on a macOS runner — with the pinned inputs re-fetched so the
  # universal library is conformance-tested too, not just built.
  # ---------------------------------------------------------------------
  macos:
    needs: release
    if: needs.release.outputs.skip != 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Make scripts executable
        run: chmod +x scripts/build.sh scripts/targets/*.sh scripts/resources/*.sh

      - name: Pin inputs and verify spec tables
        run: ./scripts/build.sh sync pinned

      - name: Build + test universal macOS library
        env:
          KHIPRO_MACOS_ARCH: universal
        run: ./scripts/build.sh macos

      - name: Package macOS artifact
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          ver="${TAG#lib-v}"
          mkdir -p dist-artifacts
          # tar.gz preserves perms + the @rpath dylib
          tar -czf "dist-artifacts/khipro-${ver}-macos-universal.tar.gz" \
              -C dist macos/universal
          ls -la dist/macos/universal/lib/

      - name: Upload macOS artifact to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" dist-artifacts/* --clobber
