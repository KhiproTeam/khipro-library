name: Layout Sync (Beta)

# Beta track. Pulls each layout's newest release of ANY kind — a -beta
# upstream release wins when it is the newest — regenerates the spec tables,
# runs every conformance suite, and, if the tables changed, commits them on
# the `beta` branch with library_version written as the next beta of the
# stable line (e.g. main at 2.0.3 → 2.0.4-beta). main is never touched.
#
# The Release-Beta workflow publishes lib-v<library_version> from the beta
# branch as a prerelease. A prerelease-suffixed library_version opts this
# track's auto-commit out (you drive the beta line manually then).

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: layout-sync-beta
  cancel-in-progress: false

jobs:
  sync-beta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Make scripts executable
        run: chmod +x scripts/build.sh scripts/targets/*.sh scripts/resources/*.sh

      - name: Recreate the beta branch from main
        run: |
          git fetch origin beta --quiet 2>/dev/null || true
          base="$(git rev-parse -q --verify origin/beta 2>/dev/null || echo HEAD)"
          # Beta is recreated from main each run — beta state is intentionally
          # short-lived; when upstream betas stabilize, the stable track picks
          # the finals up on main.
          git switch -C beta "$(git rev-parse HEAD)"

      - name: Sync beta layouts, verify spec tables, build + test
        run: ./scripts/build.sh sync beta

      - name: Commit regenerated tables and version
        run: |
          changed="$(git status --porcelain -- core/src/spec_generated.cpp core/src/spec_generated.h khipro.meta)"
          if [[ -z "$changed" ]]; then
            echo "Spec tables unchanged — betas are already current."
            exit 0
          fi

          version="$(grep '^library_version=' khipro.meta | cut -d= -f2 | tr -d '[:space:]')"
          if [[ "$version" =~ - ]]; then
            echo "::warning::library_version ${version} is a prerelease line — beta tables stay uncommitted until you bump manually."
            exit 0
          fi

          # Beta version = stable base with patch incremented + -beta:
          # main at 2.0.3 → 2.0.4-beta (previews the next stable patch).
          if [[ "$version" =~ ^([0-9]+\.[0-9]+)(\.[0-9]+)?$ ]]; then
            base="${BASH_REMATCH[1]}"
            patch=0
            [[ "$version" == *.*.* ]] && patch="${version##*.}"
            new_version="${base}.$((patch + 1))-beta"
          else
            echo "::error::library_version ${version} is not auto-bumpable — bump manually."
            exit 1
          fi
          sed -i "s/^library_version=.*/library_version=${new_version}/" khipro.meta

          layouts="classic $(grep '^khipro_classic_version=' khipro.meta | cut -d= -f2)"
          layouts+=" · classic-touch $(grep '^khipro_touchscreen_classic_version=' khipro.meta | cut -d= -f2)"
          layouts+=" · dark $(grep '^khipro_dark_version=' khipro.meta | cut -d= -f2)"
          layouts+=" · dark-touch $(grep '^khipro_touchscreen_dark_version=' khipro.meta | cut -d= -f2)"

          git add core/src/spec_generated.cpp core/src/spec_generated.h khipro.meta
          git commit -m "tables: ${layouts} (library ${new_version})"
          git push --force origin beta
          echo "::notice::beta update committed — library_version ${new_version}; Release-Beta publishes it as a prerelease."
