name: Layout Sync

# Walks one of the three lines, one commit per upstream release taken:
#
#   develop (develop) — every upstream release, any kind, oldest first.
#                       The union line; nothing releases from it.
#   stable (main)     — finals only; then a library_version patch bump.
#                       Pushing main triggers Release → lib-vX.Y.Z (full).
#   beta (beta)       — betas only; then a bump with a -beta suffix.
#                       Pushing beta triggers Release → lib-vX.Y.Z-beta.
#
# The release-line walks gate on the full conformance suites: nothing pushes
# unless every suite passes. beta first merges main so prereleases carry the
# latest code — layout files resolve to beta's own state on conflict.
# Concurrency is per channel; the lines are independent branches.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Which line to walk"
        type: choice
        options: [develop, stable, beta]
        default: develop

permissions:
  contents: write

concurrency:
  group: layout-sync-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve branch
        id: br
        run: |
          case '${{ inputs.channel }}' in
            develop) echo "branch=develop" >> "$GITHUB_OUTPUT" ;;
            stable)  echo "branch=main"    >> "$GITHUB_OUTPUT" ;;  # main is the stable release line
            beta)    echo "branch=beta"    >> "$GITHUB_OUTPUT" ;;
            *) echo "unknown channel"; exit 1 ;;
          esac

      - name: Checkout the line's branch (full history)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.br.outputs.branch }}
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Make scripts executable
        run: chmod +x scripts/build.sh scripts/targets/*.sh scripts/resources/*.sh

      # Code fixes ride into the release lines via a main merge. Layout
      # state (resources, meta, generated tables) belongs to the branch —
      # on conflict, keep the branch's.
      - name: Merge main (code flow into the beta line)
        if: inputs.channel == 'beta'
        run: |
          git fetch origin main
          if ! git merge origin/main -m "merge main into beta" --no-edit; then
            git checkout HEAD -- resources khipro.meta core/src/spec_generated.h core/src/spec_classic.cpp core/src/spec_classic_touch.cpp core/src/spec_dark.cpp core/src/spec_dark_touch.cpp 2>/dev/null || true
            if git diff --name-only --diff-filter=U | grep -q .; then
              git checkout HEAD -- $(git diff --name-only --diff-filter=U)
            fi
            git commit -qm "merge main into beta (keep beta's layout state)"
          fi

      - name: Walk releases, regenerate tables, build + test
        run: ./scripts/build.sh sync ${{ inputs.channel }}

      - name: Push the walked commits
        run: git push origin HEAD:${{ steps.br.outputs.branch }}
