name: Channel Check

# Daily dispatcher — decides which of the three lines has work and dispatches
# only those. Per layout repo it compares three pointers against the full
# ordered release list:
#
#   develop pointer (any kind)   → sync.yml channel=develop  (union ledger)
#   main pointer (finals only)   → sync.yml channel=stable   → lib-vX.Y.Z
#   beta pointer (betas only)    → sync.yml channel=beta     → lib-vX.Y.Z-beta
#
# Pointers live in each line's khipro.meta (the four khipro_*_version fields).
# The release ordering treats a beta as preceding the final of the same base
# (37.0.2-beta before 37.0.2) — see scripts/resources/releases.sh.

on:
  schedule:
    - cron: '41 3 * * *'  # daily, off-minute
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make scripts executable
        run: chmod +x scripts/resources/*.sh

      - name: Compare all three pointers against upstream releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # shellcheck source=scripts/resources/releases.sh
          source scripts/resources/releases.sh

          meta_field() { git show "$1:khipro.meta" 2>/dev/null | grep -E "^$2=" | head -1 | cut -d= -f2-; }
          meta_get()    { grep -E "^$1=" khipro.meta        | head -1 | cut -d= -f2-; }
          git fetch origin develop beta --depth 1 >/dev/null 2>&1 || true

          develop_need=false
          stable_need=false
          beta_need=false
          check() { # <key> <repo> <prefix>
            local list d s b betas
            list="$(fetch_ordered_releases "$2" "$3")" || {
              echo "::warning::$1: release listing failed for $2 — skipping this run"
              return 0
            }
            d="$(meta_field "origin/develop" "$1")"
            s="$(meta_get "$1")"   # main's own meta: we checked out main
            b="$(meta_field "origin/beta" "$1")"
            echo "$1: develop=${d:-<none>} main=${s:-<none>} beta=${b:-<none>} upstream=$(newest_of_kind "$list" any)"

            [[ -n "$(slice_after "$list" "$d")" ]] && develop_need=true
            local finals; finals="$(mktemp)"
            awk -F'\t' '$2 == "final"' "$list" >"$finals"
            [[ -n "$(slice_after "$finals" "$s")" ]] && stable_need=true
            betas="$(mktemp)"
            awk -F'\t' '$2 == "beta"' "$list" >"$betas"
            [[ -n "$(slice_after "$betas" "$b")" ]] && beta_need=true
            rm -f "$list" "$finals" "$betas"
          }

          check khipro_classic_version             rank-coder/khipro-m17n                  clsc
          check khipro_touchscreen_classic_version KhiproTeam/khipro-mim-touchscreen       clsc
          check khipro_dark_version                KhiproTeam/khipro-dark-m17n             drk
          check khipro_touchscreen_dark_version    KhiproTeam/khipro-dark-mim-touchscreen  drk

          if [[ "$develop_need" == true ]]; then
            gh workflow run sync.yml --ref main -f channel=develop
            echo "dispatched: sync.yml (develop)"
          fi
          if [[ "$stable_need" == true ]]; then
            gh workflow run sync.yml --ref main -f channel=stable
            echo "dispatched: sync.yml (stable)"
          fi
          if [[ "$beta_need" == true ]]; then
            gh workflow run sync.yml --ref main -f channel=beta
            echo "dispatched: sync.yml (beta)"
          fi
          if [[ "$develop_need" == false && "$stable_need" == false && "$beta_need" == false ]]; then
            echo "Everything current — nothing dispatched."
          fi
